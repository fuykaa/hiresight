name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-hiresight/go.mod
          cache: true
          cache-dependency-path: backend-hiresight/go.sum

      - name: Build binary
        working-directory: backend-hiresight
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o server ./cmd/api/main.go

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VM to known hosts
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/known_hosts << 'EOF'
          20.198.216.160 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdfFZ378Xb7ugKQQrkZAO8j5QIGIJ4FtbxWKfNklZNP
          20.198.216.160 ssh-rsa 
          20.198.216.160 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKJqsh5OASh6U1gT9UKPzESdHulTAa8edzBxPvz5tiwfw1HX8NNtYnAsPRCRP033owmTPixgZ5YX6GtWfCd2V9E=
          EOF

      - name: Upload binary
        run: scp -o ServerAliveInterval=30 backend-hiresight/server azureuser@20.198.216.160:~/server-new

      - name: Deploy on VM
        run: |
          ssh -o ServerAliveInterval=30 azureuser@20.198.216.160 'bash -s' << 'DEPLOY_EOF'
          set -e
          CONTAINER_STATUS=$(docker inspect hiresight --format "{{.State.Status}}" 2>/dev/null || echo "missing")
          [ "$CONTAINER_STATUS" = "missing" ] && { echo "ERROR: container hiresight tidak ditemukan"; exit 1; }
          chmod +x ~/server-new
          docker stop hiresight
          docker cp ~/server-new hiresight:/app/server
          docker start hiresight
          sleep 3
          RUNNING=$(docker inspect hiresight --format "{{.State.Running}}" 2>/dev/null || echo "false")
          if [ "$RUNNING" != "true" ]; then
            docker logs hiresight --tail 20
            exit 1
          fi
          echo "Backend deploy OK"
          docker logs hiresight --tail 10
          DEPLOY_EOF

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hiresight-app/package-lock.json

      - name: Install dependencies
        working-directory: hiresight-app
        run: npm ci

      - name: Build
        working-directory: hiresight-app
        env:
          NEXT_PUBLIC_API_URL: http://20.198.216.160
        run: npm run build

      - name: Prune dev dependencies
        working-directory: hiresight-app
        run: npm prune --production

      - name: Package
        run: |
          mkdir -p frontend-stage
          cp -r hiresight-app/.next frontend-stage/.next
          rm -rf frontend-stage/.next/cache
          cp hiresight-app/package.json frontend-stage/package.json
          cp -r hiresight-app/node_modules frontend-stage/node_modules
          [ -d hiresight-app/public ] && cp -r hiresight-app/public frontend-stage/public || true
          tar -czf frontend-deploy.tar.gz -C frontend-stage .
          rm -rf frontend-stage
          echo "Package size: $(du -sh frontend-deploy.tar.gz | cut -f1)"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VM to known hosts
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/known_hosts << 'EOF'
          20.198.216.160 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGdfFZ378Xb7ugKQQrkZAO8j5QIGIJ4FtbxWKfNklZNP
          20.198.216.160 ssh-rsa 
          20.198.216.160 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKJqsh5OASh6U1gT9UKPzESdHulTAa8edzBxPvz5tiwfw1HX8NNtYnAsPRCRP033owmTPixgZ5YX6GtWfCd2V9E=
          EOF

      - name: Upload package
        run: scp -o ServerAliveInterval=30 frontend-deploy.tar.gz azureuser@20.198.216.160:~/

      - name: Deploy on VM
        run: |
          ssh -o ServerAliveInterval=30 azureuser@20.198.216.160 'bash -s' << 'DEPLOY_EOF'
          set -e
          fuser -k 3000/tcp 2>/dev/null || true
          sleep 1
          rm -rf ~/hiresight-frontend
          mkdir -p ~/hiresight-frontend
          tar -xzf ~/frontend-deploy.tar.gz -C ~/hiresight-frontend
          CHUNKS=$(ls ~/hiresight-frontend/.next/static/chunks/ 2>/dev/null | wc -l)
          [ "$CHUNKS" -lt 1 ] && { echo "ERROR: static chunks kosong"; exit 1; }
          cd ~/hiresight-frontend
          sudo tee /etc/nginx/sites-available/hiresight > /dev/null << 'NGINX_EOF'
          server {
              listen 80;
              server_name _;

              location /_next/static/ {
                  alias /home/azureuser/hiresight-frontend/.next/static/;
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }

              location /public/ {
                  alias /home/azureuser/hiresight-frontend/public/;
              }

              location = /login {
                  set $upstream http://127.0.0.1:3000;
                  if ($request_method = POST) { set $upstream http://127.0.0.1:8081; }
                  proxy_pass $upstream;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_read_timeout 120;
              }

              location = /register {
                  set $upstream http://127.0.0.1:3000;
                  if ($request_method = POST) { set $upstream http://127.0.0.1:8081; }
                  proxy_pass $upstream;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_read_timeout 120;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:8081;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_read_timeout 120;
              }

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_read_timeout 120;
              }
          }
          NGINX_EOF
          sudo nginx -t && sudo systemctl reload nginx
          PORT=3000 HOSTNAME=127.0.0.1 nohup ./node_modules/.bin/next start > ~/frontend.log 2>&1 &
          sleep 10
          NODE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 || echo "000")
          if [ "$NODE_STATUS" != "200" ]; then
            echo "ERROR: Node.js tidak merespons"
            tail -30 ~/frontend.log
            exit 1
          fi
          echo "Frontend deploy OK"
          DEPLOY_EOF
